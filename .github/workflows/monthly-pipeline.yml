name: Monthly Stock Pipeline

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the new Results snapshot

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Screen the full SEC ticker universe
        env:
          # Contact string the SEC requires for automated clients. Set as a repository
          # variable (Settings > Secrets and variables > Actions > Variables).
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m magic_formula run
      - name: Commit the snapshot
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Results/
          git diff --cached --quiet || git commit -m "chore: monthly snapshot $(date +%Y-%m-%d)"
          git push
